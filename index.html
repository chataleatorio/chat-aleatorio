<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acceso — Video Chat</title>
<style>
  :root { --accent: #4f9dff; --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #8a90a0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--panel); border-radius: 16px; padding: 32px 28px;
    max-width: 380px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 22px; line-height: 1.5; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2e38;
    background: #10121a; color: var(--text); font-size: 15px; margin-bottom: 18px;
  }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .check-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .check-row input { margin-top: 3px; }
  .check-row label { font-size: 13px; color: var(--muted); line-height: 1.4; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px; margin-top: 8px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #error-msg { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Acceso privado</h1>
    <p class="lead">Esta sala de video chat es solo por invitación. Necesitas la contraseña que te compartió el administrador.</p>

    <label class="field" for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="off" />

    <div class="check-row">
      <input type="checkbox" id="age" />
      <label for="age">Confirmo que soy mayor de edad (18 años o más).</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="terms" />
      <label for="terms">Acepto tratar a las demás personas con respeto y entiendo que puedo ser expulsado por conducta inapropiada.</label>
    </div>

    <button id="submit-btn">Entrar</button>
    <p id="error-msg"></p>
  </div>

  <script>
    const btn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    btn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const ageConfirmed = document.getElementById('age').checked;
      const termsAccepted = document.getElementById('terms').checked;

      errorMsg.style.display = 'none';

      if (!password) {
        errorMsg.textContent = 'Escribe la contraseña.';
        errorMsg.style.display = 'block';
        return;
      }
      if (!ageConfirmed || !termsAccepted) {
        errorMsg.textContent = 'Debes marcar ambas casillas para continuar.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, ageConfirmed, termsAccepted }),
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/chat';
        } else {
          errorMsg.textContent = data.error || 'Ocurrió un error, intenta de nuevo.';
          errorMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      } catch (e) {
        errorMsg.textContent = 'No se pudo conectar con el servidor.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
